[package]
name = "polaris-client"
version = "0.3.4"
description = "Polaris Client - a performance-first Minecraft launcher"
authors = ["Polaris Client Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/eddddiwe/polaris-client"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = "2"
sha2 = "0.10"
dirs = "5"
sysinfo = "0.33"
which = "7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
