name = "polaris-api"
main = "worker.js"
compatibility_date = "2024-12-01"

[vars]
CURRENT_VERSION = "0.4.7"
MIN_VERSION = "0.4.2"
REPO = "eddddiwe/polaris-client"

# KV namespace for friend data (create with: wrangler kv namespace create FRIENDS)
# Then paste the returned id below.
[[kv_namespaces]]
binding = "FRIENDS"
id = "776f1750bce1429ab0da871efcc3c42f"
preview_id = "preview_776f1750bce1429ab0da871efcc3c42f"

# One live inbox per account. Chat history lives in KV.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatInbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatInbox"]
