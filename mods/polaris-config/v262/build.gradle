plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = '1.2.2'
group = 'dev.polaris.config'

base { archivesName = 'polaris-config' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
}

sourceSets {
    main { java.srcDirs += file('../common/src/main/java') }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
