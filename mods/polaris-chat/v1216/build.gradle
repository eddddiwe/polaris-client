plugins {
    id 'fabric-loom' version '1.19.3'
}

version = '1.0.0'
group = 'dev.polaris.chat'

base { archivesName = 'polaris-chat' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.6'
    mappings 'net.fabricmc:yarn:1.21.6+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.128.2+1.21.6'
}

sourceSets { main { java.srcDirs += file('../common/src/main/java') } }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
