name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Publish installer into the static site
        run: npm run sync:download

      - name: Build static site
        run: npm run build:site

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polaris-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error

      - name: Upload deployable site
        uses: actions/upload-artifact@v4
        with:
          name: polaris-site
          path: out/site
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build AppImage
        run: npm run dist:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: polaris-windows
          path: release-assets/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: polaris-linux
          path: release-assets/linux

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*.exe
            release-assets/windows/*.exe.blockmap
            release-assets/linux/*.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
