name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release metadata
        run: node scripts/check-release-metadata.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Verify updater asset name
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "dist/Polaris-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected updater asset $installer was not produced"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: polaris-windows
          path: |
            dist/Polaris-Setup-*.exe
            dist/Polaris-Setup-*.exe.blockmap
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build AppImage
        run: npm run dist:linux

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: polaris-linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: polaris-windows
          path: release-assets/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: polaris-linux
          path: release-assets/linux

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-assets/windows/*.exe
            release-assets/linux/*.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
